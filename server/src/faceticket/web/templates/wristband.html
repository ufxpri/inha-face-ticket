<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FACEPASS · 팔찌 LED 컨트롤 — ZERO POINT TOUR 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans+KR:wght@300;400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; min-height: 100%; background: #efeae0; }
  body { font-family: 'IBM Plex Sans KR', system-ui, sans-serif; color: #15110b; }
  *, *::before, *::after { box-sizing: border-box; }
  #root { width: 100%; min-height: 100%; }

  /* LED 미리보기 애니메이션 */
  @keyframes ftLedBlink   { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0.12; } }
  @keyframes ftLedBreathe { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
  @keyframes ftLedStrobe  { 0%, 8% { opacity: 1; } 9%, 100% { opacity: 0.1; } }
  @keyframes ftLedRainbow {
    0%   { background: #d83a1f; box-shadow: 0 0 28px #d83a1f; }
    33%  { background: #1f9d3a; box-shadow: 0 0 28px #1f9d3a; }
    66%  { background: #2a6cf0; box-shadow: 0 0 28px #2a6cf0; }
    100% { background: #d83a1f; box-shadow: 0 0 28px #d83a1f; }
  }
  .ft-led-blink   { animation: ftLedBlink   1s steps(1, end) infinite; }
  .ft-led-breathe { animation: ftLedBreathe 2.4s ease-in-out infinite; }
  .ft-led-strobe  { animation: ftLedStrobe  0.4s steps(1, end) infinite; }
  .ft-led-rainbow { animation: ftLedRainbow 3s linear infinite; }
</style>
</head>
<body>
<div id="root"></div>

<script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>

<!-- Theme (no JSX, plain JS) -->
<script src="/static/theme/theme.jsx"></script>

<!-- App -->
<script type="text/babel" src="/static/wristband/wristband-app.jsx" data-presets="react"></script>
</body>
</html>
