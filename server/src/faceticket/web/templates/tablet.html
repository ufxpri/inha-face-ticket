<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>FACEPASS · kiosk — ZERO POINT TOUR 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans+KR:wght@300;400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #0a0807; }

<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>

<!-- Theme + data fixtures + tiny libs (no JSX, plain JS) -->
<script src="/static/theme/theme.jsx"></script>
<script src="/static/data/show-fixture.js"></script>
<script src="/static/lib/srand.js"></script>
<script src="/static/lib/sounds.js"></script>

<script type="text/babel" src="/static/lib/scaler.jsx" data-presets="react"></script>

<!-- Atoms -->
<script type="text/babel" src="/static/atoms/face-portrait.jsx" data-presets="react"></script>

<script type="text/babel" src="/static/molecules/ticket-stub.jsx" data-presets="react"></script>
<script type="text/babel" src="/static/molecules/show-strip.jsx" data-presets="react"></script>

<script src="/static/tablet/footers.js"></script>
<script type="text/babel" src="/static/tablet/tablet-live.jsx" data-presets="react"></script>
<script type="text/babel" src="/static/tablet/tablet-app.jsx" data-presets="react"></script>
